services:
  caddy:
    image: caddy:2.10-alpine
    container_name: flourish-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-noreply@localhost}
      FLOURISH_SITE: ${FLOURISH_SITE:-flourish.localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - web

  web:
    build:
      context: .
    image: flourish-web:local
    container_name: flourish-web
    environment:
      APP_API_URL: ${APP_API_URL:-http://flourish.localhost/api/v1}
      APP_ENV: production
    networks:
      - edge
    expose:
      - '8080'

networks:
  edge:
    name: flourish-edge

volumes:
  caddy_data:
  caddy_config:
