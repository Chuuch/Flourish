services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  web:
    build:
      context: .
    image: flourish-web:local
    environment:
      APP_API_URL: http://localhost:8080
      APP_ENV: production
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`flourish.localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.http.services.web.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.web.loadbalancer.healthcheck.interval=10s

networks:
  edge:
