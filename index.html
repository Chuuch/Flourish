<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flourish</title>
    <script src="/config.js"></script>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('flourish-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }

        try {
          var storedLocale = window.localStorage.getItem('flourish-locale');
          var language = window.navigator.language.toLowerCase();
          var locale =
            storedLocale === 'en' || storedLocale === 'bg'
              ? storedLocale
              : language === 'bg' || language.indexOf('bg-') === 0
                ? 'bg'
                : 'en';
          document.documentElement.lang = locale;
        } catch (error) {
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
